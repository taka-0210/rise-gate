name: 本番へデプロイ

on:
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "全ファイルを再転送する"
        required: false
        default: false
        type: boolean
      allow_http_403:
        description: "国外アクセス制限中の403を許可する"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: rise-gate-production
  cancel-in-progress: false

jobs:
  deploy:
    name: FTPSで本番へ反映
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: ソースを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: PHP構文を検査
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './_backup/*' -print0 \
            | xargs -0 -n1 php -l

      - name: 前回の反映位置を取得
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          FTPS_SERVER_DIR: ${{ secrets.FTPS_SERVER_DIR }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$FTPS_HOST"
          test -n "$FTPS_USERNAME"
          test -n "$FTPS_PASSWORD"
          test -n "$FTPS_SERVER_DIR"

          mkdir -p deploy-state
          python3 <<'PY'
          import ftplib
          import os
          from pathlib import Path

          ftp = ftplib.FTP_TLS(os.environ["FTPS_HOST"], timeout=20)
          ftp.login(os.environ["FTPS_USERNAME"], os.environ["FTPS_PASSWORD"])
          ftp.prot_p()
          ftp.cwd(os.environ["FTPS_SERVER_DIR"])

          marker = Path("deploy-state/previous-revision")
          try:
              with marker.open("wb") as output:
                  ftp.retrbinary("RETR .rise-gate-deploy-revision", output.write)
          except ftplib.error_perm as error:
              marker.unlink(missing_ok=True)
              if not str(error).startswith("550"):
                  raise
          finally:
              ftp.quit()
          PY

          if [ ! -s deploy-state/previous-revision ]; then
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' \
              > deploy-state/previous-revision
          fi

      - name: デプロイ対象を準備
        env:
          FORCE_FULL_DEPLOY: ${{ inputs.full_deploy }}
        run: |
          set -euo pipefail

          current_revision="$(git rev-parse HEAD)"
          previous_revision=""
          if [ -s deploy-state/previous-revision ]; then
            previous_revision="$(tr -d '\r\n' < deploy-state/previous-revision)"
          fi

          is_protected_path() {
            case "$1" in
              .git/*|.github/*|.vscode/*|_backup/*|deploy/*|deploy-state/*|docs/*|tests/*|uploads/hero/*/*|.gitignore|.gitattributes|.htaccess|AGENTS.md|config/local.php|data/contact_submissions.php|data/works.php|data/improvement_masters.php|data/hero-settings.php)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          mkdir -p deploy
          : > deploy-state/files

          if [ "$FORCE_FULL_DEPLOY" != "true" ] \
            && [ -n "$previous_revision" ] \
            && git cat-file -e "${previous_revision}^{commit}" 2>/dev/null; then
            deploy_mode="差分"
            while IFS= read -r -d '' path; do
              if ! is_protected_path "$path" && [ -f "$path" ]; then
                printf '%s\0' "$path" >> deploy-state/files
              fi
            done < <(git diff --name-only --diff-filter=ACMRTUXB -z "$previous_revision" "$current_revision")

            rsync -aR --from0 --files-from=deploy-state/files ./ deploy/
          else
            deploy_mode="全体"
            rsync -a \
              --exclude='/.git/' \
              --exclude='/.github/' \
              --exclude='/.vscode/' \
              --exclude='/_backup/' \
              --exclude='/deploy/' \
              --exclude='/deploy-state/' \
              --exclude='/docs/' \
              --exclude='/tests/' \
              --exclude='/.gitignore' \
              --exclude='/.gitattributes' \
              --exclude='/.htaccess' \
              --exclude='/AGENTS.md' \
              --exclude='/data/contact_submissions.php' \
              --exclude='/data/works.php' \
              --exclude='/data/improvement_masters.php' \
              --exclude='/data/hero-settings.php' \
              --exclude='/config/local.php' \
              --exclude='/uploads/hero/*/' \
              ./ deploy/
          fi

          printf '%s\n' "$current_revision" > deploy-state/current-revision
          file_count="$(find deploy -type f | wc -l | tr -d ' ')"
          total_size="$(du -sh deploy | cut -f1)"

          {
            echo "### デプロイ対象"
            echo "- 方式: ${deploy_mode}"
            echo "- ファイル数: ${file_count}"
            echo "- 転送量: ${total_size}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 本番サーバーへ差分反映
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          FTPS_SERVER_DIR: ${{ secrets.FTPS_SERVER_DIR }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import ftplib
          import os
          from pathlib import Path, PurePosixPath

          ftp = ftplib.FTP_TLS(os.environ["FTPS_HOST"], timeout=20)
          ftp.login(os.environ["FTPS_USERNAME"], os.environ["FTPS_PASSWORD"])
          ftp.prot_p()
          ftp.cwd(os.environ["FTPS_SERVER_DIR"])
          server_root = ftp.pwd()
          deploy_root = Path("deploy")

          for local_path in sorted(path for path in deploy_root.rglob("*") if path.is_file()):
              relative_path = local_path.relative_to(deploy_root)
              remote_path = PurePosixPath(relative_path.as_posix())

              ftp.cwd(server_root)
              for directory in remote_path.parent.parts:
                  try:
                      ftp.cwd(directory)
                  except ftplib.error_perm:
                      ftp.mkd(directory)
                      ftp.cwd(directory)

              with local_path.open("rb") as source:
                  ftp.storbinary(f"STOR {remote_path.name}", source)

          ftp.quit()
          PY

      - name: 公開URLを確認
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          ALLOW_HTTP_403: ${{ inputs.allow_http_403 }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_URL"
          http_status="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --output /dev/null --write-out '%{http_code}' \
            "$PRODUCTION_URL")"

          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 400 ]; then
            exit 0
          fi

          if [ "$http_status" = "403" ] && [ "$ALLOW_HTTP_403" = "true" ]; then
            echo "::warning::国外アクセス制限によるHTTP 403を許可しました。国内からの表示確認が別途必要です。"
            {
              echo "### 公開URL確認"
              echo "- HTTP 403（国外アクセス制限中として許可）"
              echo "- 国内環境からの表示確認が必要です"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "公開URLの確認に失敗しました: HTTP ${http_status}" >&2
          exit 1

      - name: 反映位置を記録
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          FTPS_SERVER_DIR: ${{ secrets.FTPS_SERVER_DIR }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import ftplib
          import os
          from pathlib import Path

          ftp = ftplib.FTP_TLS(os.environ["FTPS_HOST"], timeout=20)
          ftp.login(os.environ["FTPS_USERNAME"], os.environ["FTPS_PASSWORD"])
          ftp.prot_p()
          ftp.cwd(os.environ["FTPS_SERVER_DIR"])

          with Path("deploy-state/current-revision").open("rb") as source:
              ftp.storbinary("STOR .rise-gate-deploy-revision", source)

          ftp.quit()
          PY
